<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Der Tutor · German Grammar Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body>
  <div class="app">
    <!-- ─── Sidebar ─────────────────────────────────── -->
    <aside class="sidebar">
      <div class="brand">
        <span class="flag" aria-hidden="true"><i></i><i></i><i></i></span>
        <div>
          <h1>Der Tutor</h1>
          <p class="brand-sub">German Grammar Bot</p>
        </div>
      </div>

      <div class="sidebar-section">
        <h2>Drill Modes</h2>
        <button class="mode-btn active" data-mode="general"><span>💬</span> Free Chat</button>
        <button class="mode-btn" data-mode="der_die_das"><span>🎯</span> der / die / das</button>
        <button class="mode-btn" data-mode="akkusativ"><span>🎯</span> Akkusativ</button>
        <button class="mode-btn" data-mode="dativ"><span>🎯</span> Dativ</button>
        <button class="mode-btn" data-mode="genitiv"><span>🎯</span> Genitiv</button>
        <button class="mode-btn" data-mode="vocab"><span>📚</span> Vocabulary</button>
      </div>

      <div class="sidebar-footer">
        <button id="new-chat-btn" class="ghost-btn">+ New Chat</button>
        <p class="session-label">Session: <span id="session-id">—</span></p>
      </div>
    </aside>

    <!-- ─── Main chat area ──────────────────────────── -->
    <main class="chat">
      <header class="chat-header">
        <div>
          <h2 id="current-mode-label">Free Chat</h2>
          <p class="chat-header-sub">Your personal German tutor</p>
        </div>
        <div class="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-label">Connecting…</span>
        </div>
      </header>

      <div class="messages" id="messages">
        <!-- Welcome hero (hidden automatically once a message exists) -->
        <section class="hero" id="welcome">
          <p class="eyebrow">Willkommen</p>
          <h1>Lerne Deutsch, <em>Fall für Fall.</em></h1>
          <p class="hero-sub">Ask anything about German grammar, or start from one of these.</p>
          <div class="legend">
            <span class="tag der">der</span><span class="tag die">die</span><span class="tag das">das</span>
          </div>
          <div class="cards">
            <button type="button" class="suggest" style="--i:0" data-prompt="Explain the Dativ case"><small>Cases</small><span>Explain the Dativ case</span></button>
            <button type="button" class="suggest" style="--i:1" data-prompt="Quiz me on der / die / das"><small>Drill</small><span>Quiz me on der / die / das</span></button>
            <button type="button" class="suggest" style="--i:2" data-prompt="Translate a sentence"><small>Translate</small><span>Translate a sentence</span></button>
            <button type="button" class="suggest" style="--i:3" data-prompt="What's the difference between Akkusativ and Dativ?"><small>Compare</small><span>What's the difference between Akkusativ and Dativ?</span></button>
            <button type="button" class="suggest" style="--i:4" data-prompt="Give me 5 beginner nouns"><small>Vocabulary</small><span>Give me 5 beginner nouns</span></button>
            <button type="button" class="suggest" style="--i:5" data-prompt="Show me a Genitiv example"><small>Examples</small><span>Show me a Genitiv example</span></button>
          </div>
        </section>
      </div>

      <form class="composer" id="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Ask a question or answer the drill…" autocomplete="off"></textarea>
          <button type="submit" id="send-btn" title="Send (Enter)" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </form>
    </main>
  </div>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
